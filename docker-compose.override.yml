# Development overlay, merged automatically by `docker compose up`.
# It is NOT applied in production; use instead:
#   docker compose -f docker-compose.yml up -d
#
# It publishes the infrastructure ports on the host and bind-mounts the source
# with hot reload — two things never to do on a hospital deployment.

services:
  qdrant:
    ports:
      - "6333:6333"

  ollama:
    ports:
      - "11434:11434"

  backend:
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: local
      LOG_JSON: "false"
      LOG_LEVEL: DEBUG
    volumes:
      - ./backend:/app
      - ./demo_docs_officiels:/demo_docs:ro
    # `--reload` watches /app: the bind mount above makes edits take effect
    # without rebuilding the image.
    entrypoint:
      ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    environment:
      NODE_ENV: development
