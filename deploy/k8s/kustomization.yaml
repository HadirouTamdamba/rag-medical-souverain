apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: medibot

resources:
  - 00-namespace-config.yaml
  - 10-qdrant.yaml
  - 20-ollama.yaml
  - 30-backend.yaml
  - 40-frontend.yaml
  - 50-ingress-netpol.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: medibot
    includeSelectors: false

images:
  - name: medibot-backend
    newName: registry.hospital.example/medibot-backend
    newTag: local
  - name: medibot-frontend
    newName: registry.hospital.example/medibot-frontend
    newTag: local
