name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        # sentence-transformers is excluded: it drags in torch (~2 GB) while the
        # test suite uses a fake embedder. The real installation is validated by
        # the "images" job, which builds the full Dockerfile.
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            $(grep -v '^#' requirements.txt | grep -vE '^(sentence-transformers|torch)' | tr '\n' ' ') \
            -r requirements-dev.txt

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Pytest
        run: pytest

  frontend:
    name: Frontend — lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Check the standalone output
        run: test -f .next/standalone/server.js

      - name: No secret in the browser bundle
        # Safety net against a regression back to NEXT_PUBLIC_API_KEY: anything
        # inlined here is readable by any user.
        run: |
          if grep -rlE 'NEXT_PUBLIC_API_KEY|BACKEND_API_KEY' .next/static 2>/dev/null; then
            echo "::error::An API key is present in the client bundle."
            exit 1
          fi

  compose:
    name: Compose — validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate both profiles
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet
          docker compose config --quiet

  images:
    name: Images — build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          # The embedding model (~500 MB) is not prefetched in CI: we validate
          # the build chain, not the shipping image.
          build-args: PREFETCH_EMBEDDING_MODEL=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
